<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olii's Beer · QR de las mesas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lobster&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=3">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  .controles { max-width: 900px; margin: 0 auto; padding: 20px 16px; display: grid; gap: 10px; }
  .controles input { width: 100%; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 10px 14px; }
  .controles .aviso { color: var(--ambar); font-size: 14px; }

  .hojas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }
  .tarjeta-qr {
    background: var(--fondo); border: 2px solid var(--fuego); border-radius: 22px;
    padding: 22px 18px; text-align: center; display: grid; gap: 10px; justify-items: center;
    box-shadow: inset 0 0 40px rgba(232,100,28,.25);
    break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .tarjeta-qr .marca { font-size: 34px; margin: 0; }
  .tarjeta-qr .mesa { font-size: 26px; font-weight: 800; color: var(--ambar); }
  .tarjeta-qr .codigo { background: #fff; padding: 12px; border-radius: 14px; }
  .tarjeta-qr .codigo img, .tarjeta-qr .codigo canvas { display: block; }
  .tarjeta-qr .llamado { color: var(--crema); font-weight: 600; font-size: 17px; }
  .tarjeta-qr .pasos { color: var(--suave); font-size: 12px; }

  @media print {
    .controles { display: none; }
    body { background: #fff; }
    .hojas { grid-template-columns: repeat(2, 1fr); padding: 0; }
  }
</style>
</head>
<body>
<div class="controles">
  <label for="base">Dirección de la página de pedidos (la que se publica):</label>
  <input id="base">
  <div class="aviso" id="aviso"></div>
  <div><button class="boton" onclick="print()">🖨 Imprimir</button></div>
</div>
<div class="hojas" id="hojas"></div>

<script src="config.js?v=3"></script>
<script>
  const C = window.ROCKOLA;
  const base = document.getElementById('base');
  base.value = new URL('index.html', location.href).href;

  function dibujar() {
    const hojas = document.getElementById('hojas');
    hojas.replaceChildren();
    document.getElementById('aviso').textContent = base.value.startsWith('https://') ? ''
      : '⚠ Esta dirección es de tu computador. Abre esta página desde el link publicado para que los QR funcionen en los celulares.';
    for (let n = 1; n <= C.mesas; n++) {
      const t = document.createElement('div');
      t.className = 'tarjeta-qr';
      t.innerHTML = '<p class="marca">Olii\'s Beer</p><div class="mesa"></div><div class="codigo"></div>' +
        '<div class="llamado">🎵 Escanéame y pide tu canción</div>' +
        '<div class="pasos">Abre la cámara · Busca la canción · Toca "Pedir"</div>';
      t.querySelector('.mesa').textContent = 'Mesa ' + n;
      const url = new URL(base.value);
      url.searchParams.set('mesa', n);
      new QRCode(t.querySelector('.codigo'), {
        text: url.href, width: 180, height: 180,
        colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M
      });
      hojas.append(t);
    }
  }
  base.addEventListener('change', dibujar);
  dibujar();
</script>
</body>
</html>
